# Local coding agent popups.
#
# Source this from ~/.tmux.conf:
#   source-file ~/.config/local-coding-agent/tmux/agent.tmux.conf
#
# Bindings (prefix first):
#   prefix + o   OpenCode on the active model
#   prefix + i   Pi on the active model
#   prefix + c   plain chat with the model (no file access)
#   prefix + m   model registry — what's downloaded, what's serving
#   prefix + s   server status
#   prefix + S   restart the server (do this between long sessions)
#   prefix + T   tool_call check
#
# Popups keep the agent out of your window layout, so closing it returns you
# exactly where you were. -E closes the popup when the command exits.

bind-key o display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
  "agent-run opencode"

bind-key i display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "agent-run pi"

# Plain chat against the same resident model — no file access, no extra memory.
bind-key c display-popup -E -w 80% -h 80% "agent-chat"

bind-key m display-popup -E -w 80% -h 50% \
  "agent-model list; echo; read -n 1 -s -r -p 'Press any key to close'"

bind-key s display-popup -E -w 70% -h 40% \
  "agent-serve status; echo; read -n 1 -s -r -p 'Press any key to close'"

# The KV cache grows across a session and mlx-lm's cap is best-effort. A restart
# between long sessions is cheap insurance — see the note in bin/agent-serve.
bind-key S display-popup -E -w 70% -h 40% \
  "agent-serve restart; echo; read -n 1 -s -r -p 'Press any key to close'"

bind-key T display-popup -E -w 70% -h 60% \
  "toolcall-check; echo; read -n 1 -s -r -p 'Press any key to close'"

# Optional: show whether the server is up in the status bar.
set -g status-right "#(agent-serve status 2>/dev/null | head -1 | cut -c1-40) | %H:%M "
set -g status-interval 60
