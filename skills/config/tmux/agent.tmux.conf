# Local coding agent popups.
#
# Source this from ~/.tmux.conf:
#   source-file ~/.config/local-coding-agent/tmux/agent.tmux.conf
#
# Bindings (prefix first):
#   prefix + o   OpenCode on the active model
#   prefix + i   Pi on the active model
#   prefix + m   model registry — what's installed, what's active
#   prefix + T   tool_call check on the active model
#
# Popups keep the agent out of your window layout, so closing it returns you
# exactly where you were. -E closes the popup when the command exits.

bind-key o display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
  "agent-run opencode"

bind-key i display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "agent-run pi"

bind-key m display-popup -E -w 70% -h 50% \
  "agent-model list; echo; read -n 1 -s -r -p 'Press any key to close'"

bind-key T display-popup -E -w 70% -h 60% \
  "toolcall-check; echo; read -n 1 -s -r -p 'Press any key to close'"

# Optional: show the active model in the status bar, so you always know which
# one is about to answer. Comment out if you dislike the noise.
set -g status-right "#(agent-model show 2>/dev/null | awk '/^name:/{print $2}') | %H:%M "
set -g status-interval 60
